services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      AUTH_MODE: dev
      DEV_USER_ID: dev-user
      GOOGLE_CLOUD_ENABLED: "false"
      GOOGLE_CLOUD_LOCATION: us-central1
    volumes:
      - ./backend/src:/app/backend/src
      - ./frontend/static:/app/frontend/static
    command: uv run uvicorn ai_voice_coach.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/backend/src
