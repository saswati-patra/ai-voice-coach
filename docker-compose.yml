services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DEV_USER_ID: dev-user
      GOOGLE_CLOUD_ENABLED: "false"
      GOOGLE_CLOUD_LOCATION: us-central1
    volumes:
      - ./src:/app/src
      - ./static:/app/static
    command: uv run uvicorn ai_voice_coach.main:app --host 0.0.0.0 --port 8000 --reload
