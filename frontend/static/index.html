<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Voice Coach</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      main {
        max-width: 840px;
        margin: 48px auto;
        padding: 0 20px;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin: 0 0 12px;
      }

      .controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0;
      }

      button {
        min-height: 40px;
        border: 1px solid #202124;
        background: #202124;
        color: white;
        padding: 0 14px;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      button.secondary {
        background: white;
        color: #202124;
      }

      .status {
        align-items: center;
        display: flex;
        gap: 8px;
        margin: 16px 0 0;
      }

      .dot {
        background: #a3a3a3;
        border-radius: 999px;
        display: inline-block;
        height: 10px;
        width: 10px;
      }

      .dot.connected {
        background: #1a73e8;
      }

      .dot.recording {
        background: #188038;
      }

      .dot.error {
        background: #d93025;
      }

      pre {
        min-height: 240px;
        overflow: auto;
        background: #111;
        color: #f6f6f6;
        padding: 16px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Voice Coach</h1>
      <p>Local microphone harness for the voice-session WebSocket.</p>
      <div class="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-label">disconnected</span>
      </div>
      <div class="controls">
        <button id="connect">Connect</button>
        <button id="start-mic" class="secondary" disabled>Start Mic</button>
        <button id="stop-mic" class="secondary" disabled>Stop Mic</button>
        <button id="disconnect" class="secondary" disabled>Disconnect</button>
      </div>
      <pre id="log"></pre>
    </main>

    <script>
      const log = document.querySelector("#log");
      const statusDot = document.querySelector("#status-dot");
      const statusLabel = document.querySelector("#status-label");
      const connectButton = document.querySelector("#connect");
      const startMicButton = document.querySelector("#start-mic");
      const stopMicButton = document.querySelector("#stop-mic");
      const disconnectButton = document.querySelector("#disconnect");

      const INPUT_SAMPLE_RATE = 16000;
      const OUTPUT_SAMPLE_RATE = 24000;
      let socket;
      let mediaStream;
      let audioContext;
      let micSource;
      let recorderNode;
      let playbackContext;
      let nextPlaybackTime = 0;

      function write(message) {
        log.textContent += `[${new Date().toLocaleTimeString()}] ${message}\n`;
        log.scrollTop = log.scrollHeight;
      }

      function setStatus(status) {
        statusDot.className = `dot ${status}`;
        statusLabel.textContent = status;
      }

      function setControls({ connected, recording }) {
        connectButton.disabled = connected;
        startMicButton.disabled = !connected || recording;
        stopMicButton.disabled = !recording;
        disconnectButton.disabled = !connected;
      }

      function socketIsOpen() {
        return socket?.readyState === WebSocket.OPEN;
      }

      function sendEvent(type, payload = {}) {
        if (!socketIsOpen()) {
          write("WebSocket is not connected.");
          return;
        }
        socket.send(JSON.stringify({ type, payload }));
      }

      function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        const chunkSize = 0x8000;

        for (let index = 0; index < bytes.length; index += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
        }

        return btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }

        return bytes.buffer;
      }

      function parseSampleRate(mimeType, fallback) {
        const match = /rate=(\d+)/.exec(mimeType || "");
        return match ? Number(match[1]) : fallback;
      }

      function downsampleToPcm16(samples, sourceSampleRate, targetSampleRate) {
        if (sourceSampleRate === targetSampleRate) {
          return floatToPcm16(samples);
        }

        const ratio = sourceSampleRate / targetSampleRate;
        const outputLength = Math.floor(samples.length / ratio);
        const output = new Float32Array(outputLength);

        for (let index = 0; index < outputLength; index += 1) {
          const start = Math.floor(index * ratio);
          const end = Math.min(Math.floor((index + 1) * ratio), samples.length);
          let total = 0;

          for (let sampleIndex = start; sampleIndex < end; sampleIndex += 1) {
            total += samples[sampleIndex];
          }

          output[index] = total / Math.max(1, end - start);
        }

        return floatToPcm16(output);
      }

      function floatToPcm16(samples) {
        const buffer = new ArrayBuffer(samples.length * 2);
        const view = new DataView(buffer);

        samples.forEach((sample, index) => {
          const clipped = Math.max(-1, Math.min(1, sample));
          const value = clipped < 0 ? clipped * 0x8000 : clipped * 0x7fff;
          view.setInt16(index * 2, value, true);
        });

        return buffer;
      }

      function pcm16ToFloat32(buffer) {
        const view = new DataView(buffer);
        const samples = new Float32Array(buffer.byteLength / 2);

        for (let index = 0; index < samples.length; index += 1) {
          samples[index] = view.getInt16(index * 2, true) / 0x8000;
        }

        return samples;
      }

      function buildRecorderWorkletUrl() {
        const code = `
          class PcmRecorderProcessor extends AudioWorkletProcessor {
            process(inputs) {
              const channel = inputs[0]?.[0];
              if (channel) {
                this.port.postMessage(channel.slice(0));
              }
              return true;
            }
          }

          registerProcessor("pcm-recorder", PcmRecorderProcessor);
        `;

        return URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
      }

      async function connectSocket() {
        if (socketIsOpen()) {
          return;
        }

        socket = new WebSocket(`ws://${window.location.host}/api/v1/ws/voice-session`);
        setStatus("connected");
        setControls({ connected: true, recording: false });

        socket.addEventListener("open", () => {
          write("connected");
          sendEvent("session.start");
        });

        socket.addEventListener("message", (event) => {
          handleServerEvent(JSON.parse(event.data));
        });

        socket.addEventListener("close", () => {
          write("closed");
          setStatus("disconnected");
          setControls({ connected: false, recording: false });
        });

        socket.addEventListener("error", () => {
          write("WebSocket error");
          setStatus("error");
        });
      }

      async function startMic() {
        if (!socketIsOpen()) {
          write("Connect before starting the microphone.");
          return;
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
          },
        });

        audioContext = new AudioContext();
        const workletUrl = buildRecorderWorkletUrl();
        await audioContext.audioWorklet.addModule(workletUrl);
        URL.revokeObjectURL(workletUrl);

        micSource = audioContext.createMediaStreamSource(mediaStream);
        recorderNode = new AudioWorkletNode(audioContext, "pcm-recorder");
        const queuedSamples = [];
        let queuedSampleCount = 0;
        const targetChunkSamples = Math.floor(audioContext.sampleRate / 10);

        recorderNode.port.onmessage = (event) => {
          if (!socketIsOpen()) {
            return;
          }

          queuedSamples.push(event.data);
          queuedSampleCount += event.data.length;

          if (queuedSampleCount < targetChunkSamples) {
            return;
          }

          const chunk = new Float32Array(queuedSampleCount);
          let offset = 0;

          for (const samples of queuedSamples) {
            chunk.set(samples, offset);
            offset += samples.length;
          }

          queuedSamples.length = 0;
          queuedSampleCount = 0;

          const pcmBuffer = downsampleToPcm16(
            chunk,
            audioContext.sampleRate,
            INPUT_SAMPLE_RATE
          );

          sendEvent("audio.chunk", {
            data: arrayBufferToBase64(pcmBuffer),
            mime_type: `audio/pcm;rate=${INPUT_SAMPLE_RATE}`,
          });
        };

        micSource.connect(recorderNode);
        recorderNode.connect(audioContext.destination);
        setStatus("recording");
        setControls({ connected: true, recording: true });
        write(`recording microphone at ${audioContext.sampleRate} Hz`);
      }

      async function stopMic() {
        recorderNode?.disconnect();
        micSource?.disconnect();
        mediaStream?.getTracks().forEach((track) => track.stop());
        await audioContext?.close();

        recorderNode = undefined;
        micSource = undefined;
        mediaStream = undefined;
        audioContext = undefined;

        if (socketIsOpen()) {
          sendEvent("session.stop");
        }

        setStatus(socketIsOpen() ? "connected" : "disconnected");
        setControls({ connected: socketIsOpen(), recording: false });
        write("microphone stopped");
      }

      async function disconnectSocket() {
        if (mediaStream) {
          await stopMic();
        }

        socket?.close();
      }

      async function handleServerEvent(event) {
        if (event.type === "coach.message") {
          write(`coach: ${event.payload?.text || ""}`);
          return;
        }

        if (event.type === "transcript.partial") {
          write(`you: ${event.payload?.text || ""}`);
          return;
        }

        if (event.type === "audio.chunk") {
          await playAudioChunk(event.payload);
          return;
        }

        if (event.type === "error") {
          write(`error: ${event.payload?.message || "unknown error"}`);
          setStatus("error");
          return;
        }

        write(event.type);
      }

      async function playAudioChunk(payload) {
        const sampleRate = parseSampleRate(payload?.mime_type, OUTPUT_SAMPLE_RATE);
        const samples = pcm16ToFloat32(base64ToArrayBuffer(payload.data));
        playbackContext ||= new AudioContext({ sampleRate });

        const audioBuffer = playbackContext.createBuffer(1, samples.length, sampleRate);
        audioBuffer.copyToChannel(samples, 0);

        const source = playbackContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playbackContext.destination);

        const startAt = Math.max(playbackContext.currentTime, nextPlaybackTime);
        source.start(startAt);
        nextPlaybackTime = startAt + audioBuffer.duration;
      }

      connectButton.addEventListener("click", connectSocket);
      startMicButton.addEventListener("click", () => startMic().catch((error) => {
        write(`microphone error: ${error.message}`);
        setStatus("error");
        setControls({ connected: socketIsOpen(), recording: false });
      }));
      stopMicButton.addEventListener("click", stopMic);
      disconnectButton.addEventListener("click", disconnectSocket);

      setControls({ connected: false, recording: false });
    </script>
  </body>
</html>
