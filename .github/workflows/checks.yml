name: Checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Check Backend
        run: make backend-check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      VITE_AUTH_MODE: dev
      VITE_API_BASE_URL: ""
      VITE_WS_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Frontend
        run: make frontend-check
