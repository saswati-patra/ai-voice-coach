name: Deploy Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend And Frontend
    runs-on: ubuntu-latest

    env:
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      BACKEND_SERVICE_ACCOUNT: ${{ vars.BACKEND_SERVICE_ACCOUNT }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${{ vars.GOOGLE_CLOUD_STORAGE_BUCKET }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required repository variables
        run: |
          required=(
            ARTIFACT_REGISTRY_REPOSITORY
            BACKEND_SERVICE_ACCOUNT
            CLOUD_RUN_SERVICE
            FIREBASE_PROJECT_ID
            FIREBASE_HOSTING_SITE
            GCP_DEPLOYER_SERVICE_ACCOUNT
            GCP_PROJECT_ID
            GCP_REGION
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GOOGLE_CLOUD_STORAGE_BUCKET
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub repository variables:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Check Backend
        run: make backend-check

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Frontend
        working-directory: frontend
        env:
          VITE_AUTH_MODE: firebase
          VITE_API_BASE_URL: ""
          VITE_WS_BASE_URL: ""
        run: make -C .. frontend-check

      - name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set Up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build And Push Backend Image
        id: image
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/backend:${GITHUB_SHA}"
          latest_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/backend:latest"

          docker build \
            --build-arg VITE_AUTH_MODE=firebase \
            --build-arg VITE_API_BASE_URL= \
            --build-arg VITE_WS_BASE_URL= \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" \
            --build-arg "VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}" \
            --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            -f backend/Dockerfile \
            -t "${image_uri}" \
            -t "${latest_uri}" \
            .

          docker push "${image_uri}"
          docker push "${latest_uri}"
          echo "image_uri=${image_uri}" >>"${GITHUB_OUTPUT}"

      - name: Deploy Backend To Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ steps.image.outputs.image_uri }}
          env_vars: |-
            APP_ENV=cloud
            APP_NAME=AI Voice Coach
            AUTH_MODE=firebase
            DEV_USER_ID=dev-user
            GOOGLE_CLOUD_ENABLED=true
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }}
            GOOGLE_CLOUD_STORAGE_BUCKET=${{ env.GOOGLE_CLOUD_STORAGE_BUCKET }}
            FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
            FIREBASE_CHECK_REVOKED=false
            FIREBASE_ALLOWED_SIGN_IN_PROVIDER=google.com
            FIRESTORE_DATABASE=(default)
            GEMINI_LIVE_MODEL=gemini-live-2.5-flash-native-audio
            GEMINI_DOCUMENT_MODEL=gemini-2.5-flash
            GEMINI_RESPONSE_MODALITIES=audio
          flags: >-
            --allow-unauthenticated
            --port=8000
            --service-account=${{ env.BACKEND_SERVICE_ACCOUNT }}
            --timeout=3600

      - name: Smoke Test Cloud Run
        run: curl --fail --show-error --silent "${{ steps.deploy-backend.outputs.url }}/health"

      - name: Build Frontend For Hosting
        working-directory: frontend
        env:
          VITE_AUTH_MODE: firebase
          VITE_API_BASE_URL: ${{ steps.deploy-backend.outputs.url }}
          VITE_WS_BASE_URL: ${{ steps.deploy-backend.outputs.url }}
        run: |
          export VITE_WS_BASE_URL="${VITE_WS_BASE_URL/https:/wss:}"
          npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Frontend To Firebase Hosting
        run: |
          firebase target:apply hosting app "${FIREBASE_HOSTING_SITE}" \
            --project "${FIREBASE_PROJECT_ID}"
          firebase deploy --only hosting:app \
            --project "${FIREBASE_PROJECT_ID}" \
            --non-interactive

      - name: Deployment Summary
        run: |
          {
            echo "### Deployment"
            echo
            echo "- Cloud Run: ${{ steps.deploy-backend.outputs.url }}"
            echo "- Firebase Hosting: https://${FIREBASE_HOSTING_SITE}.web.app"
          } >>"${GITHUB_STEP_SUMMARY}"
